<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B9D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>기념일 챙김 - Anniversary Keeper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF6B9D',
            secondary: '#C44569',
            accent: '#F8B500',
            dark: '#2D3436',
            light: '#F5F6FA'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    * { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #F5F6FA; overscroll-behavior-y: none; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .btn-primary { @apply bg-primary text-white px-6 py-3 rounded-xl font-semibold shadow-lg active:scale-95 transition-transform w-full; }
    .btn-secondary { @apply bg-white text-primary border-2 border-primary px-6 py-3 rounded-xl font-semibold active:scale-95 transition-transform w-full; }
    .card { @apply bg-white rounded-2xl shadow-md p-4; }
    .input { @apply w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary focus:outline-none transition-colors; }
    .nav-item.active { color: #FF6B9D; }
    .nav-item.active svg { stroke: #FF6B9D; }
    .theme-default { background: linear-gradient(135deg, #FF6B9D, #C44569); }
    .theme-sky { background: linear-gradient(135deg, #60A5FA, #06B6D4); }
    .theme-forest { background: linear-gradient(135deg, #4ADE80, #059669); }
    .theme-sunset { background: linear-gradient(135deg, #FB923C, #EF4444); }
    .theme-midnight { background: linear-gradient(135deg, #6366F1, #7C3AED); }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="text-dark">
  <div id="app" class="min-h-screen pb-20 max-w-md mx-auto bg-light relative">
    
    <!-- 홈 페이지 -->
    <div id="page-home" class="page active p-4 space-y-4">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">기념일 챙김</h1>
        <button onclick="showPage('add')" class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="today-holiday" class="hidden bg-accent/10 rounded-xl p-3 flex items-center gap-2">
        <svg class="text-accent" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="text-accent font-semibold text-sm" id="holiday-text"></span>
      </div>
      <div class="w-full h-16 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 text-sm border-2 border-dashed border-gray-300">
        <span>배너 광고 영역</span>
      </div>
      <div class="space-y-3">
        <h2 class="font-bold text-lg">다가오는 기념일</h2>
        <div id="anniversary-list" class="space-y-3"></div>
      </div>
      <div class="w-full h-16 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 text-sm border-2 border-dashed border-gray-300">
        <span>배너 광고 영역</span>
      </div>
    </div>

    <!-- 추가 페이지 -->
    <div id="page-add" class="page p-4">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="showPage('home')" class="p-2 -ml-2">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold">기념일 추가</h1>
      </div>
      <form onsubmit="handleAdd(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">이름</label>
          <input type="text" id="add-name" placeholder="예: 처음 만난 날" class="input" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">날짜</label>
          <input type="date" id="add-date" class="input" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">종류</label>
          <div class="flex gap-2">
            <button type="button" onclick="setType('love')" id="type-love" class="flex-1 py-3 rounded-xl font-medium bg-primary text-white transition-colors">연애</button>
            <button type="button" onclick="setType('birthday')" id="type-birthday" class="flex-1 py-3 rounded-xl font-medium bg-gray-100 text-gray-600 transition-colors">생일</button>
            <button type="button" onclick="setType('custom')" id="type-custom" class="flex-1 py-3 rounded-xl font-medium bg-gray-100 text-gray-600 transition-colors">커스텀</button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="add-repeat" checked class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
          <label for="add-repeat" class="text-sm font-medium">매년 반복</label>
        </div>
        <button type="submit" class="btn-primary mt-6">저장</button>
      </form>
    </div>

    <!-- 상세 페이지 -->
    <div id="page-detail" class="page p-4 space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="showPage('home')" class="p-2 -ml-2">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex gap-2">
          <button onclick="editCurrent()" class="p-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button onclick="shareCurrent()" class="p-2">
            <svg class="text-primary" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
        </div>
      </div>
      <div class="card text-center py-8 space-y-2">
        <h1 id="detail-name" class="text-3xl font-bold"></h1>
        <p id="detail-date" class="text-gray-500"></p>
        <div id="detail-dday" class="text-5xl font-bold text-primary"></div>
      </div>
      <div class="w-full h-16 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 text-sm border-2 border-dashed border-gray-300">
        <span>배너 광고 영역</span>
      </div>
      <div class="space-y-3">
        <h2 class="font-bold text-lg">마일스톤</h2>
        <div id="milestones-list" class="space-y-2"></div>
      </div>
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-lg">감정 일기</h2>
          <button onclick="showDiaryWrite()" class="text-primary text-sm font-medium">작성하기</button>
        </div>
        <div id="detail-diaries" class="space-y-2"></div>
      </div>
    </div>

    <!-- 수정 페이지 -->
    <div id="page-edit" class="page p-4">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <button onclick="showPage('detail')" class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <h1 class="text-xl font-bold">기념일 수정</h1>
        </div>
        <button onclick="deleteCurrent()" class="text-red-500 p-2">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <form onsubmit="handleEdit(event)" class="space-y-4">
        <input type="hidden" id="edit-id">
        <div>
          <label class="block text-sm font-medium mb-2">이름</label>
          <input type="text" id="edit-name" class="input" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">날짜</label>
          <input type="date" id="edit-date" class="input" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">종류</label>
          <div class="flex gap-2">
            <button type="button" onclick="setEditType('love')" id="edit-type-love" class="flex-1 py-3 rounded-xl font-medium bg-primary text-white transition-colors">연애</button>
            <button type="button" onclick="setEditType('birthday')" id="edit-type-birthday" class="flex-1 py-3 rounded-xl font-medium bg-gray-100 text-gray-600 transition-colors">생일</button>
            <button type="button" onclick="setEditType('custom')" id="edit-type-custom" class="flex-1 py-3 rounded-xl font-medium bg-gray-100 text-gray-600 transition-colors">커스텀</button>
          </div>
        </div>
        <button type="submit" class="btn-primary mt-6">저장</button>
      </form>
    </div>

    <!-- 캘린더 페이지 -->
    <div id="page-calendar" class="page p-4 space-y-4">
      <h1 class="text-2xl font-bold">캘린더</h1>
      <div class="card">
        <div id="calendar-header" class="flex items-center justify-between mb-4">
          <button onclick="changeMonth(-1)" class="p-2"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <h2 id="calendar-month" class="text-lg font-bold"></h2>
          <button onclick="changeMonth(1)" class="p-2"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-sm mb-2">
          <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-500">토</span>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </div>
      <div id="calendar-events" class="space-y-3"></div>
    </div>

    <!-- 일정 페이지 -->
    <div id="page-schedule" class="page p-4 space-y-4">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">일정 관리</h1>
        <button onclick="toggleScheduleForm()" class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white shadow-lg">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <form id="schedule-form" onsubmit="handleScheduleAdd(event)" class="hidden card space-y-3">
        <input type="text" id="schedule-title" placeholder="제목" class="input" required>
        <input type="date" id="schedule-date" class="input" required>
        <input type="time" id="schedule-time" class="input">
        <input type="text" id="schedule-memo" placeholder="메모" class="input">
        <button type="submit" class="btn-primary">추가</button>
      </form>
      <div id="schedule-list" class="space-y-3"></div>
    </div>

    <!-- 일기 페이지 -->
    <div id="page-diary" class="page p-4 space-y-4">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">감정 일기</h1>
        <button onclick="toggleDiaryForm()" class="btn-primary text-sm w-auto">작성하기</button>
      </div>
      <form id="diary-form" onsubmit="handleDiaryAdd(event)" class="hidden card space-y-3">
        <select id="diary-anniversary" class="input">
          <option value="">관련 기념일 선택 (선택사항)</option>
        </select>
        <input type="date" id="diary-date" class="input">
        <textarea id="diary-text" placeholder="오늘의 이야기를 적어보세요..." class="input min-h-[100px]" required></textarea>
        <button type="button" class="btn-secondary flex items-center justify-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          사진 추가 (준비중)
        </button>
        <button type="submit" class="btn-primary">저장</button>
      </form>
      <div id="diary-list" class="space-y-4"></div>
    </div>

    <!-- 일기 작성 (상세에서) -->
    <div id="page-diary-write" class="page p-4">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="showPage('detail')" class="p-2 -ml-2">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold">일기 작성</h1>
      </div>
      <form onsubmit="handleDiaryWrite(event)" class="space-y-4">
        <input type="hidden" id="diary-write-anniversary">
        <input type="date" id="diary-write-date" class="input">
        <textarea id="diary-write-text" placeholder="오늘의 이야기를 적어보세요..." class="input min-h-[150px]" required></textarea>
        <button type="submit" class="btn-primary">저장</button>
      </form>
    </div>

    <!-- 테마 페이지 -->
    <div id="page-theme" class="page p-4 space-y-4">
      <h1 class="text-2xl font-bold">테마</h1>
      <p class="text-gray-500 text-sm">보상형 광고를 시청하고 새로운 테마를 해금하세요</p>
      <div id="theme-grid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- 공유 카드 페이지 -->
    <div id="page-share" class="page p-4 space-y-4">
      <div class="flex items-center gap-3">
        <button onclick="showPage('detail')" class="p-2 -ml-2">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold">축하 카드</h1>
      </div>
      <div id="share-card" class="theme-default rounded-3xl p-8 text-white text-center space-y-4 aspect-[4/5] flex flex-col justify-center">
        <p id="share-name" class="text-lg opacity-80"></p>
        <h2 id="share-dday" class="text-6xl font-bold"></h2>
        <p id="share-date" class="text-sm opacity-80"></p>
        <div class="mt-4 pt-4 border-t border-white/20">
          <p class="text-sm opacity-60">Anniversary Keeper</p>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="downloadCard()" class="btn-primary flex-1 flex items-center justify-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          저장
        </button>
        <button onclick="shareCard()" class="btn-secondary flex-1 flex items-center justify-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          공유
        </button>
      </div>
    </div>

    <!-- 설정 페이지 -->
    <div id="page-settings" class="page p-4 space-y-6">
      <h1 class="text-2xl font-bold">설정</h1>
      
      <div class="space-y-3">
        <h2 class="font-bold flex items-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          언어
        </h2>
        <div class="flex gap-2">
          <button onclick="setLanguage('ko')" id="lang-ko" class="flex-1 py-2 rounded-xl text-sm font-medium bg-primary text-white">한국어</button>
          <button onclick="setLanguage('en')" id="lang-en" class="flex-1 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600">English</button>
          <button onclick="setLanguage('ja')" id="lang-ja" class="flex-1 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600">日本語</button>
          <button onclick="setLanguage('zh')" id="lang-zh" class="flex-1 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600">中文</button>
        </div>
      </div>

      <div class="space-y-3">
        <h2 class="font-bold">데이터 관리</h2>
        <button onclick="exportData()" class="btn-secondary flex items-center justify-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          데이터 백업 (보내기)
        </button>
        <label class="btn-secondary flex items-center justify-center gap-2 cursor-pointer">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          데이터 복원 (가져오기)
          <input type="file" accept=".json" onchange="importData(this)" class="hidden">
        </label>
        <button onclick="resetData()" class="w-full py-3 rounded-xl border-2 border-red-200 text-red-500 font-medium flex items-center justify-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          전체 초기화
        </button>
      </div>

      <div class="space-y-3">
        <h2 class="font-bold">알림</h2>
        <div class="card flex items-center justify-between">
          <span>푸시 알림</span>
          <button onclick="toggleNotifications()" id="notif-toggle" class="w-12 h-7 rounded-full bg-primary transition-colors relative">
            <div class="w-5 h-5 bg-white rounded-full shadow-md transition-transform translate-x-6 absolute top-1"></div>
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 네비게이션 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-4 py-2 z-50">
      <div class="flex justify-around items-center">
        <button onclick="showPage('home')" class="nav-item active flex flex-col items-center gap-1 text-gray-400" data-page="home">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-xs font-medium">홈</span>
        </button>
        <button onclick="showPage('calendar')" class="nav-item flex flex-col items-center gap-1 text-gray-400" data-page="calendar">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="text-xs font-medium">캘린더</span>
        </button>
        <button onclick="showPage('diary')" class="nav-item flex flex-col items-center gap-1 text-gray-400" data-page="diary">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="text-xs font-medium">일기</span>
        </button>
        <button onclick="showPage('theme')" class="nav-item flex flex-col items-center gap-1 text-gray-400" data-page="theme">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span class="text-xs font-medium">테마</span>
        </button>
        <button onclick="showPage('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-400" data-page="settings">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.17 15a1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V2a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="text-xs font-medium">설정</span>
        </button>
      </div>
    </nav>

  </div>

  <script>
    // ==================== 데이터 관리 ====================
    const defaultData = {
      anniversaries: [],
      events: [],
      diaries: [],
      settings: { language: 'ko', theme: 'default', notifications: true, notificationDays: [7, 1, 0] },
      unlockedThemes: ['default']
    };

    let data = JSON.parse(localStorage.getItem('anniversaryData')) || JSON.parse(JSON.stringify(defaultData));
    let currentDetailId = null;
    let currentCalendarDate = new Date();
    let selectedType = 'love';
    let selectedEditType = 'love';

    const holidays = [
      { name: '새해', month: 0, day: 1, type: 'holiday' },
      { name: '발렌타인데이', month: 1, day: 14, type: 'event' },
      { name: '화이트데이', month: 2, day: 14, type: 'event' },
      { name: '어린이날', month: 4, day: 5, type: 'holiday' },
      { name: '어버이날', month: 4, day: 8, type: 'event' },
      { name: '스승의날', month: 4, day: 15, type: 'event' },
      { name: '현충일', month: 5, day: 6, type: 'holiday' },
      { name: '빼빼로데이', month: 10, day: 11, type: 'event' },
      { name: '크리스마스', month: 11, day: 25, type: 'holiday' }
    ];

    const lunarHolidays = [
      { name: '설날', date: '2026-02-17', type: 'holiday' },
      { name: '추석', date: '2026-09-25', type: 'holiday' }
    ];

    function saveData() {
      localStorage.setItem('anniversaryData', JSON.stringify(data));
    }

    // ==================== 유틸리티 ====================
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
    }

    function formatDateShort(dateStr) {
      const d = new Date(dateStr);
      return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    }

    function calculateDDay(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr);
      target.setHours(0, 0, 0, 0);
      const diff = Math.floor((today - target) / (1000 * 60 * 60 * 24));
      return diff;
    }

    function getMilestones(dateStr) {
      const milestones = [50, 100, 200, 300, 365, 500, 730, 1000, 1825, 3650];
      const start = new Date(dateStr);
      return milestones.map(days => {
        const milestoneDate = new Date(start);
        milestoneDate.setDate(milestoneDate.getDate() + days);
        return {
          days,
          date: `${milestoneDate.getFullYear()}-${String(milestoneDate.getMonth() + 1).padStart(2, '0')}-${String(milestoneDate.getDate()).padStart(2, '0')}`,
          passed: calculateDDay(milestoneDate) >= 0
        };
      });
    }

    function getTodayHolidays() {
      const today = new Date();
      const month = today.getMonth();
      const day = today.getDate();
      const dateStr = `${today.getFullYear()}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const fixed = holidays.filter(h => h.month === month && h.day === day);
      const lunar = lunarHolidays.filter(h => h.date === dateStr);
      return [...fixed, ...lunar];
    }

    // ==================== 페이지 전환 ====================
    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${pageName}`).classList.add('active');
      
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const navItem = document.querySelector(`.nav-item[data-page="${pageName}"]`);
      if (navItem) navItem.classList.add('active');

      // 페이지별 초기화
      if (pageName === 'home') renderHome();
      if (pageName === 'calendar') renderCalendar();
      if (pageName === 'schedule') renderSchedule();
      if (pageName === 'diary') renderDiary();
      if (pageName === 'theme') renderTheme();
      if (pageName === 'settings') renderSettings();
    }

    // ==================== 홈 ====================
    function renderHome() {
      const list = document.getElementById('anniversary-list');
      const todayHolidays = getTodayHolidays();
      const holidayDiv = document.getElementById('today-holiday');
      const holidayText = document.getElementById('holiday-text');
      
      if (todayHolidays.length > 0) {
        holidayDiv.classList.remove('hidden');
        holidayText.textContent = `오늘은 ${todayHolidays.map(h => h.name).join(', ')}!`;
      } else {
        holidayDiv.classList.add('hidden');
      }

      const sorted = [...data.anniversaries].sort((a, b) => {
        const da = Math.abs(calculateDDay(a.date));
        const db = Math.abs(calculateDDay(b.date));
        return da - db;
      });

      if (sorted.length === 0) {
        list.innerHTML = `
          <div class="card text-center py-8 text-gray-400">
            <p>기념일을 추가해보세요!</p>
            <button onclick="showPage('add')" class="btn-primary inline-block mt-4 w-auto px-8">추가하기</button>
          </div>`;
        return;
      }

      list.innerHTML = sorted.map(a => {
        const dDay = calculateDDay(a.date);
        const isPast = dDay >= 0;
        const icon = a.type === 'love' ? 
          `<svg class="text-primary" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>` :
          `<svg class="text-accent" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
        
        return `
          <div onclick="showDetail('${a.id}')" class="card flex items-center gap-4 active:scale-[0.98] transition-transform cursor-pointer">
            <div class="w-12 h-12 rounded-full flex items-center justify-center ${isPast ? 'bg-primary/10' : 'bg-accent/10'}">
              ${icon}
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-lg">${a.name}</h3>
              <p class="text-gray-500 text-sm">${formatDateShort(a.date)}</p>
            </div>
            <div class="text-xl font-bold ${isPast ? 'text-primary' : 'text-accent'}">
              ${isPast ? `D+${dDay}` : `D${dDay}`}
            </div>
          </div>`;
      }).join('');
    }

    // ==================== 추가 ====================
    function setType(type) {
      selectedType = type;
      ['love', 'birthday', 'custom'].forEach(t => {
        const btn = document.getElementById(`type-${t}`);
        if (t === type) {
          btn.classList.remove('bg-gray-100', 'text-gray-600');
          btn.classList.add('bg-primary', 'text-white');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('bg-gray-100', 'text-gray-600');
        }
      });
    }

    function handleAdd(e) {
      e.preventDefault();
      const name = document.getElementById('add-name').value;
      const date = document.getElementById('add-date').value;
      const repeat = document.getElementById('add-repeat').checked;
      
      if (!name || !date) return;
      
      data.anniversaries.push({
        id: generateId(),
        name,
        date,
        type: selectedType,
        repeat,
        notifications: [7, 1, 0]
      });
      
      saveData();
      document.getElementById('add-name').value = '';
      document.getElementById('add-date').value = '';
      setType('love');
      showPage('home');
    }

    // ==================== 상세 ====================
    function showDetail(id) {
      currentDetailId = id;
      const a = data.anniversaries.find(x => x.id === id);
      if (!a) return;
      
      const dDay = calculateDDay(a.date);
      document.getElementById('detail-name').textContent = a.name;
      document.getElementById('detail-date').textContent = formatDate(a.date);
      document.getElementById('detail-dday').textContent = dDay >= 0 ? `D+${dDay}` : `D${dDay}`;
      document.getElementById('detail-dday').className = `text-5xl font-bold ${dDay >= 0 ? 'text-primary' : 'text-accent'}`;
      
      const milestones = getMilestones(a.date);
      document.getElementById('milestones-list').innerHTML = milestones.slice(0, 5).map(m => `
        <div class="card flex justify-between items-center ${m.passed ? 'opacity-50' : ''}">
          <span class="font-medium">${m.days}일</span>
          <span class="text-gray-500 text-sm">${m.date}</span>
          ${m.passed ? '<span class="text-primary text-sm font-bold">달성!</span>' : ''}
        </div>
      `).join('');
      
      const diaries = data.diaries.filter(d => d.anniversaryId === id).sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById('detail-diaries').innerHTML = diaries.length === 0 ? 
        '<div class="card text-center py-6 text-gray-400"><p>아직 작성된 일기가 없습니다</p></div>' :
        diaries.map(d => `
          <div class="card">
            <p class="text-gray-500 text-sm mb-2">${formatDate(d.date)}</p>
            <p class="text-sm line-clamp-3">${d.text}</p>
          </div>
        `).join('');
      
      showPage('detail');
    }

    function editCurrent() {
      const a = data.anniversaries.find(x => x.id === currentDetailId);
      if (!a) return;
      
      document.getElementById('edit-id').value = a.id;
      document.getElementById('edit-name').value = a.name;
      document.getElementById('edit-date').value = a.date;
      setEditType(a.type);
      showPage('edit');
    }

    function setEditType(type) {
      selectedEditType = type;
      ['love', 'birthday', 'custom'].forEach(t => {
        const btn = document.getElementById(`edit-type-${t}`);
        if (t === type) {
          btn.classList.remove('bg-gray-100', 'text-gray-600');
          btn.classList.add('bg-primary', 'text-white');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('bg-gray-100', 'text-gray-600');
        }
      });
    }

    function handleEdit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value;
      const date = document.getElementById('edit-date').value;
      
      const idx = data.anniversaries.findIndex(a => a.id === id);
      if (idx >= 0) {
        data.anniversaries[idx] = { ...data.anniversaries[idx], name, date, type: selectedEditType };
        saveData();
      }
      showDetail(id);
    }

    function deleteCurrent() {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      data.anniversaries = data.anniversaries.filter(a => a.id !== currentDetailId);
      saveData();
      showPage('home');
    }

    function showDiaryWrite() {
      document.getElementById('diary-write-anniversary').value = currentDetailId;
      document.getElementById('diary-write-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('diary-write-text').value = '';
      showPage('diary-write');
    }

    function handleDiaryWrite(e) {
      e.preventDefault();
      const anniversaryId = document.getElementById('diary-write-anniversary').value;
      const date = document.getElementById('diary-write-date').value;
      const text = document.getElementById('diary-write-text').value;
      
      data.diaries.push({ id: generateId(), anniversaryId, date, text, photos: [] });
      saveData();
      showDetail(anniversaryId);
    }

    // ==================== 공유 카드 ====================
    function shareCurrent() {
      const a = data.anniversaries.find(x => x.id === currentDetailId);
      if (!a) return;
      
      const dDay = calculateDDay(a.date);
      document.getElementById('share-name').textContent = a.name;
      document.getElementById('share-dday').textContent = dDay >= 0 ? `D+${dDay}` : `D${dDay}`;
      document.getElementById('share-date').textContent = formatDate(a.date);
      
      // 테마 적용
      const card = document.getElementById('share-card');
      card.className = `theme-${data.settings.theme} rounded-3xl p-8 text-white text-center space-y-4 aspect-[4/5] flex flex-col justify-center`;
      
      showPage('share');
    }

    function downloadCard() {
      alert('html2canvas 라이브러리를 CDN으로 추가하시면 이미지 저장이 가능합니다. 현재는 화면 캡처를 이용해주세요.');
    }

    function shareCard() {
      alert('Web Share API를 지원하는 브라우저에서는 공유 가능합니다. 현재는 이미지 저장 후 직접 공유해주세요.');
    }

    // ==================== 캘린더 ====================
    function renderCalendar() {
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      document.getElementById('calendar-month').textContent = `${year}년 ${month + 1}월`;
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      let html = '';
      for (let i = 0; i < firstDay; i++) html += '<div></div>';
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasEvent = data.anniversaries.some(a => {
          const d = new Date(a.date);
          return d.getMonth() === month && d.getDate() === day;
        }) || data.events.some(e => e.date === dateStr);
        
        html += `<div onclick="showCalendarDate(${year}, ${month}, ${day})" class="aspect-square flex items-center justify-center rounded-lg text-sm cursor-pointer ${hasEvent ? 'bg-primary/10 text-primary font-bold' : 'hover:bg-gray-100'}">${day}</div>`;
      }
      
      document.getElementById('calendar-grid').innerHTML = html;
      document.getElementById('calendar-events').innerHTML = '<p class="text-gray-400 text-center py-4">날짜를 선택하세요</p>';
    }

    function changeMonth(delta) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
      renderCalendar();
    }

    function showCalendarDate(year, month, day) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const events = [
        ...data.anniversaries.filter(a => {
          const d = new Date(a.date);
          return d.getMonth() === month && d.getDate() === day;
        }).map(a => ({ ...a, isAnniversary: true })),
        ...data.events.filter(e => e.date === dateStr)
      ];
      
      document.getElementById('calendar-events').innerHTML = events.length === 0 ?
        '<p class="text-gray-400 text-center py-4">등록된 일정이 없습니다</p>' :
        events.map(e => `
          <div onclick="${e.isAnniversary ? `showDetail('${e.id}')` : ''}" class="card flex items-center gap-3 ${e.isAnniversary ? 'cursor-pointer' : ''}">
            <div class="w-3 h-3 rounded-full ${e.isAnniversary ? 'bg-primary' : 'bg-accent'}"></div>
            <span class="font-medium">${e.name || e.title}</span>
          </div>
        `).join('');
    }

    // ==================== 일정 ====================
    function toggleScheduleForm() {
      const form = document.getElementById('schedule-form');
      form.classList.toggle('hidden');
    }

    function handleScheduleAdd(e) {
      e.preventDefault();
      const title = document.getElementById('schedule-title').value;
      const date = document.getElementById('schedule-date').value;
      const time = document.getElementById('schedule-time').value;
      const memo = document.getElementById('schedule-memo').value;
      
      data.events.push({ id: generateId(), title, date, time, memo });
      saveData();
      
      document.getElementById('schedule-title').value = '';
      document.getElementById('schedule-date').value = '';
      document.getElementById('schedule-time').value = '';
      document.getElementById('schedule-memo').value = '';
      toggleScheduleForm();
      renderSchedule();
    }

    function renderSchedule() {
      const sorted = [...data.events].sort((a, b) => new Date(a.date) - new Date(b.date));
      document.getElementById('schedule-list').innerHTML = sorted.length === 0 ?
        '<div class="card text-center py-8 text-gray-400"><p>등록된 일정이 없습니다</p></div>' :
        sorted.map(e => `
          <div class="card flex justify-between items-center">
            <div>
              <h3 class="font-bold">${e.title}</h3>
              <p class="text-gray-500 text-sm">${e.date} ${e.time || ''}</p>
              ${e.memo ? `<p class="text-gray-400 text-sm mt-1">${e.memo}</p>` : ''}
            </div>
            <button onclick="deleteEvent('${e.id}')" class="text-gray-400 p-2">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `).join('');
    }

    function deleteEvent(id) {
      data.events = data.events.filter(e => e.id !== id);
      saveData();
      renderSchedule();
    }

    // ==================== 일기 ====================
    function toggleDiaryForm() {
      const form = document.getElementById('diary-form');
      form.classList.toggle('hidden');
      
      const select = document.getElementById('diary-anniversary');
      select.innerHTML = '<option value="">관련 기념일 선택 (선택사항)</option>' +
        data.anniversaries.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      document.getElementById('diary-date').value = new Date().toISOString().split('T')[0];
    }

    function handleDiaryAdd(e) {
      e.preventDefault();
      const anniversaryId = document.getElementById('diary-anniversary').value;
      const date = document.getElementById('diary-date').value;
      const text = document.getElementById('diary-text').value;
      
      data.diaries.push({ id: generateId(), anniversaryId, date, text, photos: [] });
      saveData();
      
      document.getElementById('diary-text').value = '';
      toggleDiaryForm();
      renderDiary();
    }

    function renderDiary() {
      const sorted = [...data.diaries].sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById('diary-list').innerHTML = sorted.length === 0 ?
        `<div class="card text-center py-12 text-gray-400">
          <svg class="mx-auto mb-4 opacity-50" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <p>아직 작성된 일기가 없습니다</p>
          <p class="text-sm mt-2">소중한 추억을 기록해보세요</p>
        </div>` :
        sorted.map(d => {
          const anniv = data.anniversaries.find(a => a.id === d.anniversaryId);
          return `
            <div class="card space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-gray-500 text-sm">${formatDate(d.date)}</span>
                ${anniv ? `<span class="text-primary text-xs font-medium bg-primary/10 px-2 py-1 rounded-full">${anniv.name}</span>` : ''}
              </div>
              <p class="text-sm leading-relaxed">${d.text}</p>
            </div>
          `;
        }).join('');
    }

    // ==================== 테마 ====================
    const themes = [
      { id: 'default', name: '기본', class: 'theme-default', locked: false },
      { id: 'sky', name: '하늘', class: 'theme-sky', locked: true },
      { id: 'forest', name: '숲', class: 'theme-forest', locked: true },
      { id: 'sunset', name: '석양', class: 'theme-sunset', locked: true },
      { id: 'midnight', name: '밤하늘', class: 'theme-midnight', locked: true }
    ];

    function renderTheme() {
      document.getElementById('theme-grid').innerHTML = themes.map(t => {
        const isUnlocked = data.unlockedThemes.includes(t.id);
        const isActive = data.settings.theme === t.id;
        return `
          <button onclick="selectTheme('${t.id}')" class="relative rounded-2xl p-4 h-32 ${t.class} ${isActive ? 'ring-4 ring-primary ring-offset-2' : ''} ${!isUnlocked ? 'opacity-80' : ''}">
            <span class="text-white font-bold text-lg">${t.name}</span>
            ${!isUnlocked ? `<div class="absolute inset-0 flex items-center justify-center bg-black/30 rounded-2xl"><svg class="text-white" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>` : ''}
            ${isActive ? `<div class="absolute top-2 right-2"><svg class="text-white" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>` : ''}
          </button>
        `;
      }).join('');
    }

    function selectTheme(themeId) {
      if (data.unlockedThemes.includes(themeId)) {
        data.settings.theme = themeId;
        saveData();
        renderTheme();
      } else {
        if (confirm('광고를 시청하고 테마를 해금하시겠습니까?')) {
          data.unlockedThemes.push(themeId);
          data.settings.theme = themeId;
          saveData();
          alert('테마가 해금되었습니다!');
          renderTheme();
        }
      }
    }

    // ==================== 설정 ====================
    function setLanguage(lang) {
      data.settings.language = lang;
      saveData();
      renderSettings();
      alert('언어가 변경되었습니다. (UI 텍스트는 현재 한국어 고정, 다국어 JSON 데이터는 저장됨)');
    }

    function renderSettings() {
      ['ko', 'en', 'ja', 'zh'].forEach(lang => {
        const btn = document.getElementById(`lang-${lang}`);
        if (data.settings.language === lang) {
          btn.classList.remove('bg-gray-100', 'text-gray-600');
          btn.classList.add('bg-primary', 'text-white');
        } else {
          btn.classList.remove('bg-primary', 'text-white');
          btn.classList.add('bg-gray-100', 'text-gray-600');
        }
      });
      
      const toggle = document.getElementById('notif-toggle');
      const knob = toggle.querySelector('div');
      if (data.settings.notifications) {
        toggle.classList.remove('bg-gray-300');
        toggle.classList.add('bg-primary');
        knob.classList.remove('translate-x-1');
        knob.classList.add('translate-x-6');
      } else {
        toggle.classList.remove('bg-primary');
        toggle.classList.add('bg-gray-300');
        knob.classList.remove('translate-x-6');
        knob.classList.add('translate-x-1');
      }
    }

    function toggleNotifications() {
      data.settings.notifications = !data.settings.notifications;
      saveData();
      renderSettings();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'anniversary-data.json';
      a.click();
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          data = JSON.parse(e.target.result);
          saveData();
          alert('데이터가 성공적으로 복원되었습니다!');
          showPage('home');
        } catch (err) {
          alert('파일 형식이 올바르지 않습니다.');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function resetData() {
      if (!confirm('모든 데이터가 삭제됩니다. 정말 초기화하시겠습니까?')) return;
      localStorage.removeItem('anniversaryData');
      data = JSON.parse(JSON.stringify(defaultData));
      saveData();
      alert('초기화되었습니다.');
      showPage('home');
    }

    // ==================== 초기화 ====================
    document.addEventListener('DOMContentLoaded', () => {
      // 오늘 날짜 기본값 설정
      document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
      renderHome();
    });

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `)).catch(() => {});
    }
  </script>
</body>
</html>
